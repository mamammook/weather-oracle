<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานสภาพอากาศ - Weather Report</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .map-container {
            height: 400px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .location-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .location-info h3 {
            margin-bottom: 5px;
        }

        .today-weather {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .weather-item {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            transition: transform 0.3s ease;
        }

        .weather-item:hover {
            transform: translateY(-5px);
        }

        .weather-item .label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
        }

        .weather-item .value {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .weather-item .unit {
            font-size: 1rem;
            color: #999;
        }

        .weather-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .forecast-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .forecast-day {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .forecast-day:hover {
            transform: scale(1.05);
        }

        .forecast-day .date {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .forecast-day .temp {
            font-size: 2rem;
            margin: 10px 0;
        }

        .forecast-day .temp-min {
            opacity: 0.8;
            font-size: 1.2rem;
        }

        .forecast-day .description {
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2rem;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .coordinates {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .today-weather {
                grid-template-columns: repeat(2, 1fr);
            }

            .forecast-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .today-weather {
                grid-template-columns: 1fr;
            }

            .forecast-container {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.5rem;
            }
        }

        .hourly-container {
            margin-top: 20px;
            overflow-x: auto;
        }

        .hourly-scroll {
            display: flex;
            gap: 10px;
            padding: 10px 0;
        }

        .hourly-item {
            min-width: 100px;
            padding: 15px;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-radius: 10px;
            text-align: center;
        }

        .hourly-item .time {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
        }

        .hourly-item .temp {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ รายงานสภาพอากาศ</h1>
            <p>เลือกตำแหน่งบนแผนที่เพื่อดูข้อมูลสภาพอากาศ</p>
        </div>

        <div id="error-message" class="error" style="display: none;"></div>

        <div class="main-content">
            <div class="card">
                <h2>🗺️ เลือกตำแหน่ง</h2>
                <div class="map-container">
                    <div id="map"></div>
                </div>
                <div class="location-info">
                    <h3 id="location-name">กำลังโหลด...</h3>
                    <div class="coordinates" id="location-coords"></div>
                </div>
            </div>

            <div class="card">
                <h2>☀️ สภาพอากาศวันนี้</h2>
                <div id="today-weather">
                    <div class="loading">กำลังโหลดข้อมูล...</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>📅 พยากรณ์อากาศ 7 วัน</h2>
            <div id="forecast-weather">
                <div class="loading">กำลังโหลดข้อมูล...</div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Default coordinates from URL (Thailand - Udon Thani area)
        let currentLat = 17.408695957518777;
        let currentLng = 102.77854799592062;

        // Initialize map
        const map = L.map('map').setView([currentLat, currentLng], 7);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 18
        }).addTo(map);

        // Add marker
        let marker = L.marker([currentLat, currentLng], {draggable: true}).addTo(map);

        // Update location when marker is dragged
        marker.on('dragend', function(e) {
            const position = marker.getLatLng();
            currentLat = position.lat;
            currentLng = position.lng;
            updateLocationInfo(currentLat, currentLng);
            fetchWeatherData(currentLat, currentLng);
        });

        // Update location when map is clicked
        map.on('click', function(e) {
            currentLat = e.latlng.lat;
            currentLng = e.latlng.lng;
            marker.setLatLng([currentLat, currentLng]);
            updateLocationInfo(currentLat, currentLng);
            fetchWeatherData(currentLat, currentLng);
        });

        // Weather code to description mapping
        const weatherCodes = {
            0: {desc: 'ท้องฟ้าแจ่มใส', icon: '☀️'},
            1: {desc: 'ส่วนมากแจ่มใส', icon: '🌤️'},
            2: {desc: 'มีเมฆบางส่วน', icon: '⛅'},
            3: {desc: 'เมฆมาก', icon: '☁️'},
            45: {desc: 'หมอก', icon: '🌫️'},
            48: {desc: 'หมอกน้ำค้างแข็ง', icon: '🌫️'},
            51: {desc: 'ฝนโปรยปรายเล็กน้อย', icon: '🌦️'},
            53: {desc: 'ฝนโปรยปรายปานกลาง', icon: '🌦️'},
            55: {desc: 'ฝนโปรยปรายหนาแน่น', icon: '🌦️'},
            56: {desc: 'ฝนโปรยปรายเยือกแข็งเล็กน้อย', icon: '🌨️'},
            57: {desc: 'ฝนโปรยปรายเยือกแข็งหนาแน่น', icon: '🌨️'},
            61: {desc: 'ฝนตกเล็กน้อย', icon: '🌧️'},
            63: {desc: 'ฝนตกปานกลาง', icon: '🌧️'},
            65: {desc: 'ฝนตกหนัก', icon: '⛈️'},
            66: {desc: 'ฝนเยือกแข็งเล็กน้อย', icon: '🌨️'},
            67: {desc: 'ฝนเยือกแข็งหนัก', icon: '🌨️'},
            71: {desc: 'หิมะตกเล็กน้อย', icon: '❄️'},
            73: {desc: 'หิมะตกปานกลาง', icon: '❄️'},
            75: {desc: 'หิมะตกหนัก', icon: '❄️'},
            77: {desc: 'เกล็ดหิมะ', icon: '❄️'},
            80: {desc: 'ฝนตกเล็กน้อย', icon: '🌧️'},
            81: {desc: 'ฝนตกปานกลาง', icon: '🌧️'},
            82: {desc: 'ฝนตกหนัก', icon: '⛈️'},
            85: {desc: 'หิมะตกเล็กน้อย', icon: '❄️'},
            86: {desc: 'หิมะตกหนัก', icon: '❄️'},
            95: {desc: 'พายุฝนฟ้าคะนอง', icon: '⛈️'},
            96: {desc: 'พายุฝนฟ้าคะนองพร้อมลูกเห็บ', icon: '⛈️'},
            99: {desc: 'พายุฝนฟ้าคะนองพร้อมลูกเห็บหนัก', icon: '⛈️'}
        };

        function getWeatherInfo(code) {
            return weatherCodes[code] || {desc: 'ไม่ทราบ', icon: '❓'};
        }

        async function updateLocationInfo(lat, lng) {
            const coordsElement = document.getElementById('location-coords');
            coordsElement.textContent = `ละติจูด: ${lat.toFixed(6)}, ลองจิจูด: ${lng.toFixed(6)}`;
            
            // Try to get location name using reverse geocoding
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=th`);
                const data = await response.json();
                const locationName = data.address?.village || data.address?.city || data.address?.town || data.address?.state || 'ตำแหน่งที่เลือก';
                document.getElementById('location-name').textContent = locationName;
            } catch (error) {
                document.getElementById('location-name').textContent = 'ตำแหน่งที่เลือก';
            }
        }

        async function fetchWeatherData(lat, lng) {
            const errorMessage = document.getElementById('error-message');
            errorMessage.style.display = 'none';

            try {
                // Fetch today's hourly data
                const todayUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weathercode,windspeed_10m&timezone=Asia/Bangkok&forecast_days=1`;
                
                // Fetch 7-day forecast
                const forecastUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,windspeed_10m_max&timezone=Asia/Bangkok&forecast_days=7`;

                const [todayResponse, forecastResponse] = await Promise.all([
                    fetch(todayUrl),
                    fetch(forecastUrl)
                ]);

                if (!todayResponse.ok || !forecastResponse.ok) {
                    throw new Error('ไม่สามารถโหลดข้อมูลสภาพอากาศได้');
                }

                const todayData = await todayResponse.json();
                const forecastData = await forecastResponse.json();

                displayTodayWeather(todayData);
                displayForecast(forecastData);

            } catch (error) {
                errorMessage.textContent = `เกิดข้อผิดพลาด: ${error.message}`;
                errorMessage.style.display = 'block';
            }
        }

        function displayTodayWeather(data) {
            const container = document.getElementById('today-weather');
            const hourly = data.hourly;
            const now = new Date();
            const currentHour = now.getHours();

            // Get current weather (closest hour)
            const currentTemp = hourly.temperature_2m[currentHour] || hourly.temperature_2m[0];
            const currentHumidity = hourly.relative_humidity_2m[currentHour] || hourly.relative_humidity_2m[0];
            const currentPrecip = hourly.precipitation_probability[currentHour] || hourly.precipitation_probability[0];
            const currentWeatherCode = hourly.weathercode[currentHour] || hourly.weathercode[0];
            const currentWind = hourly.windspeed_10m[currentHour] || hourly.windspeed_10m[0];
            const weatherInfo = getWeatherInfo(currentWeatherCode);

            // Calculate min/max for today
            const todayTemps = hourly.temperature_2m;
            const todayMin = Math.min(...todayTemps);
            const todayMax = Math.max(...todayTemps);

            container.innerHTML = `
                <div class="weather-item">
                    <div class="weather-icon">${weatherInfo.icon}</div>
                    <div class="label">สภาพอากาศ</div>
                    <div class="value" style="font-size: 1.2rem;">${weatherInfo.desc}</div>
                </div>
                <div class="weather-item">
                    <div class="label">อุณหภูมิปัจจุบัน</div>
                    <div class="value">${Math.round(currentTemp)}<span class="unit">°C</span></div>
                </div>
                <div class="weather-item">
                    <div class="label">อุณหภูมิต่ำสุด</div>
                    <div class="value">${Math.round(todayMin)}<span class="unit">°C</span></div>
                </div>
                <div class="weather-item">
                    <div class="label">อุณหภูมิสูงสุด</div>
                    <div class="value">${Math.round(todayMax)}<span class="unit">°C</span></div>
                </div>
                <div class="weather-item">
                    <div class="label">ความชื้น</div>
                    <div class="value">${Math.round(currentHumidity)}<span class="unit">%</span></div>
                </div>
                <div class="weather-item">
                    <div class="label">ความน่าจะเป็นฝน</div>
                    <div class="value">${Math.round(currentPrecip)}<span class="unit">%</span></div>
                </div>
                <div class="weather-item">
                    <div class="label">ความเร็วลม</div>
                    <div class="value">${Math.round(currentWind)}<span class="unit"> km/h</span></div>
                </div>
            `;

            // Add hourly forecast
            const hourlyContainer = document.createElement('div');
            hourlyContainer.className = 'hourly-container';
            hourlyContainer.innerHTML = '<h3 style="margin-bottom: 10px; color: #667eea;">พยากรณ์รายชั่วโมง</h3>';
            
            const hourlyScroll = document.createElement('div');
            hourlyScroll.className = 'hourly-scroll';
            
            // Show next 12 hours
            for (let i = currentHour; i < Math.min(currentHour + 12, hourly.time.length); i++) {
                const hourData = document.createElement('div');
                hourData.className = 'hourly-item';
                const date = new Date(hourly.time[i]);
                const hourInfo = getWeatherInfo(hourly.weathercode[i]);
                hourData.innerHTML = `
                    <div class="time">${date.getHours()}:00</div>
                    <div style="font-size: 1.5rem; margin: 5px 0;">${hourInfo.icon}</div>
                    <div class="temp">${Math.round(hourly.temperature_2m[i])}°</div>
                    <div style="font-size: 0.8rem; margin-top: 5px;">${hourly.precipitation_probability[i]}% ฝน</div>
                `;
                hourlyScroll.appendChild(hourData);
            }
            
            hourlyContainer.appendChild(hourlyScroll);
            container.appendChild(hourlyContainer);
        }

        function displayForecast(data) {
            const container = document.getElementById('forecast-weather');
            const daily = data.daily;
            
            container.innerHTML = '';
            
            const forecastDiv = document.createElement('div');
            forecastDiv.className = 'forecast-container';

            for (let i = 0; i < daily.time.length; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'forecast-day';
                
                const date = new Date(daily.time[i]);
                const dayName = date.toLocaleDateString('th-TH', { weekday: 'long' });
                const dayDate = date.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
                
                const weatherInfo = getWeatherInfo(daily.weathercode[i]);
                
                dayDiv.innerHTML = `
                    <div class="date">${dayName}</div>
                    <div style="font-size: 0.9rem; opacity: 0.9;">${dayDate}</div>
                    <div style="font-size: 3rem; margin: 10px 0;">${weatherInfo.icon}</div>
                    <div class="temp">${Math.round(daily.temperature_2m_max[i])}°</div>
                    <div class="temp-min">${Math.round(daily.temperature_2m_min[i])}°</div>
                    <div class="description">${weatherInfo.desc}</div>
                    <div style="margin-top: 10px; font-size: 0.85rem; opacity: 0.9;">
                        💧 ${daily.precipitation_probability_max[i]}% | 💨 ${Math.round(daily.windspeed_10m_max[i])} km/h
                    </div>
                `;
                
                forecastDiv.appendChild(dayDiv);
            }

            container.appendChild(forecastDiv);
        }

  }

  // Initialize
  updateLocationInfo(currentLat, currentLon);
  fetchWeatherData(currentLat, currentLon);
  sendToN8N(currentLat, currentLon);

</script>
</body>
</html>
